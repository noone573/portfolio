<!doctype html>
<html lang="en" class="game">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio: about me, skills, projects, certificates and education.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
  <script>
    // Apply the saved light/dark choice before the page paints to avoid a flash
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- Content is filled in by js/script.js from js/data.js; the text below is the no-JavaScript fallback. -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav">
        <a href="#top" class="brand" id="brand">Portfolio</a>
        <nav class="nav-links" id="site-nav" aria-label="Main">
          <a href="#about">About</a>
          <a href="#skills">Skills</a>
          <a href="#projects">Projects</a>
          <a href="#certificates">Certificates</a>
          <a href="#education">Education</a>
          <a href="#resume">Resume</a>
          <a href="#contact">Contact</a>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
          <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"></button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="hero" id="top">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-inner" id="hero"></div>
    </div>

    <section class="section" id="about">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow">About</p><h2>About me</h2></div></div>
        <div class="about-grid">
          <div class="about-text" id="about-text"></div>
          <dl class="facts" id="facts"></dl>
        </div>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow">Skills</p><h2>Skills &amp; interests</h2></div></div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head">
          <div class="section-title"><p class="eyebrow">Projects</p><h2>Things I've built</h2></div>
          <div class="chips" id="project-filters" role="group" aria-label="Filter projects by tag"></div>
        </div>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <section class="section" id="certificates">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow">Certificates</p><h2>Certificates</h2></div></div>
        <div class="cert-grid" id="cert-grid"></div>
      </div>
    </section>

    <section class="section" id="education">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow">Education</p><h2>Education</h2></div></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <section class="section" id="resume">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow">Resume</p><h2>My resume</h2></div></div>
        <div id="resume-card"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container" id="contact-inner"><h2>Contact</h2></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner" id="footer"></div>
  </footer>

  <!-- Pop-up used to view certificates and the resume -->
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-inner">
      <div class="viewer-head">
        <div>
          <h2 id="viewer-title">Preview</h2>
          <p class="viewer-sub" id="viewer-sub"></p>
        </div>
        <button class="icon-btn" id="viewer-close" type="button" aria-label="Close preview"></button>
      </div>
      <div class="viewer-body" id="viewer-body"></div>
      <div class="viewer-actions" id="viewer-actions"></div>
    </div>
  </dialog>

  <noscript><p class="container">This portfolio needs JavaScript enabled to show its content.</p></noscript>

  <!-- Content (written by the Portfolio Editor) -->
  <script src="js/data.js"></script>

  <!-- Shared helpers, icons and the cleaned-up content. Order matters: each file uses the ones above it. -->
  <script src="js/core/helpers.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/content.js"></script>
  <script src="js/core/components.js"></script>

  <!-- One file per page section -->
  <script src="js/sections/hero.js"></script>
  <script src="js/sections/about.js"></script>
  <script src="js/sections/skills.js"></script>
  <script src="js/sections/projects.js"></script>
  <script src="js/sections/certificates.js"></script>
  <script src="js/sections/education.js"></script>
  <script src="js/sections/resume.js"></script>
  <script src="js/sections/contact.js"></script>

  <!-- Page behaviour -->
  <script src="js/ui/viewer.js"></script>
  <script src="js/ui/theme.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/scroll.js"></script>
  <script src="js/ui/motion.js"></script>
  <script src="js/ui/edit-shortcut.js"></script>

  <!-- Builds the page from the pieces above -->
  <script src="js/script.js"></script>

  <!-- Game theme layer (decorates the finished page, so it loads last) -->
  <script src="js/game/state.js"></script>
  <script src="js/game/sprites.js"></script>
  <script src="js/game/layers.js"></script>
  <script src="js/game/hud.js"></script>
  <script src="js/game/effects.js"></script>
  <script src="js/game/ticker.js"></script>
  <script src="js/game/layout.js"></script>
  <script src="js/game/chicken.js"></script>
  <script src="js/game/start.js"></script>
</body>
</html>
