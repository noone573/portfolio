<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio: projects, certificates and resume.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before paint to avoid a flash
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav">
        <a href="#top" class="brand" id="brand"></a>
        <nav class="nav-links" id="site-nav" aria-label="Main"></nav>
        <div class="nav-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
          <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"></button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-inner" id="hero"></div>
    </section>

    <section class="section" id="about">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow"></p><h2></h2></div></div>
        <div class="about-grid">
          <div class="about-main" id="about-main"></div>
          <div class="skills" id="skills"></div>
        </div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-head">
          <div class="section-title"><p class="eyebrow"></p><h2></h2></div>
          <div class="chips" id="project-filters" aria-label="Filter projects"></div>
        </div>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <section class="section" id="certificates">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow"></p><h2></h2></div></div>
        <div class="cert-grid" id="cert-grid"></div>
      </div>
    </section>

    <section class="section" id="resume">
      <div class="container">
        <div class="section-head"><div class="section-title"><p class="eyebrow"></p><h2></h2></div></div>
        <div class="resume-grid">
          <div id="timeline"></div>
          <div id="resume-viewer"></div>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container" id="contact-inner"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner" id="footer"></div>
  </footer>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-inner">
      <div class="viewer-head">
        <div>
          <h3 id="viewer-title"></h3>
          <p class="viewer-sub" id="viewer-sub"></p>
        </div>
        <button class="icon-btn" id="viewer-close" type="button" aria-label="Close preview"></button>
      </div>
      <div class="viewer-body" id="viewer-body"></div>
      <div class="viewer-actions" id="viewer-actions"></div>
    </div>
  </dialog>

  <noscript><p class="container">This portfolio needs JavaScript enabled to show its content.</p></noscript>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
